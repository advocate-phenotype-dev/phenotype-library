phenotype:
  name: Incident NSTEMI (RWE)
  version: 1.2.0
  domain: condition
  omop_aligned: true
  clarity_required: false
  target_concept_ids:
  - 314666
  icd_codes:
  - I21.4
  description: |
    Validated phenotype for incident Non-ST-elevation myocardial infarction (NSTEMI)
    developed for real-world evidence studies across the Advocate Health / Atrium
    Health network. Identifies first-ever NSTEMI events using a 365-day lookback
    washout, high-sensitivity troponin I confirmation (>2x ULN within 24h), and
    OMOP standard concept 314666. Validated via blinded chart review of 350 randomly
    sampled records across five sites. PPV 91.4% (95% CI 88.0–94.1%).
    Version 1.2.0 corrects a lookback boundary condition present in v1.0–v1.1.
  inclusion_criteria: |
    1. Condition occurrence: OMOP concept 314666 (NSTEMI), ICD-10 I21.4;
       includeDescendants = true, includeMapped = true.
    2. Encounter setting: inpatient or emergency department
       (condition_type_concept_id IN 32817, 32020).
    3. High-sensitivity cardiac troponin I (LOINC 10839-9, OMOP concept 3016502)
       > 2x upper limit of normal (ULN = 34 ng/L; threshold = 68 ng/L)
       within 24 hours of index condition_start_date.
    4. 365-day lookback washout: no prior NSTEMI (concept 314666) in the
       365 days preceding the index date — required for incident case
       classification in observational/RWE studies.
    5. Index event on or after 2020-01-01 (EHR data completeness threshold).
  exclusion_criteria: |
    1. Concurrent STEMI (ICD-10 I21.0–I21.3, OMOP concept 312327)
       within ±1 day of index event — managed on a separate clinical pathway.
    2. Type 2 MI (demand ischemia, ICD-10 I21.A1) documented by provider
       narrative or clinical clarification flag.
    3. Prior NSTEMI within 365 days of index date (see washout criterion 4 above).
    4. Troponin not documented within 24h of index encounter — required for
       biochemical confirmation of diagnosis.
  validation_status: peer_reviewed
  validation_method: chart_review
  ppv: 0.914
  phekb_id: null
  ohdsi_pl_id: null
