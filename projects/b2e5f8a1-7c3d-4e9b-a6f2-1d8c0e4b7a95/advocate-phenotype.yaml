phenotype:
  name: NSTEMI Quality Phenotype
  version: 0.1.0
  domain: condition
  omop_aligned: true
  clarity_required: false
  target_concept_ids:
  - 314666
  icd_codes:
  - I21.4
  description: 'Operationally deployed phenotype identifying Non-ST-elevation myocardial
    infarction (NSTEMI) admissions across Advocate Health and Atrium Health network
    sites. Supports the NSTEMI quality measure reporting program aligned to ACC/AHA
    chest-pain guidelines (2021) and CMS-based quality reporting. Entry criterion:
    OMOP concept 314666, mapped from ICD-10 I21.4. Tightened v0.2.0+ definition adds
    high-sensitivity cardiac troponin I >2x ULN within 24 hours of the index encounter.

    '
  inclusion_criteria: "1. Condition occurrence: OMOP concept 314666 (NSTEMI), mapped\
    \ from ICD-10 I21.4;\n   includeDescendants = true, includeMapped = true.\n2.\
    \ Encounter setting: inpatient or emergency department visit\n   (condition_type_concept_id\
    \ IN 32817, 32020).\n3. Tightened definition (v0.2.0+): high-sensitivity cardiac\
    \ troponin I\n   (LOINC 10839-9, OMOP 3016502) > 2x upper limit of normal (ULN\
    \ = 34 ng/L;\n   threshold = 68 ng/L) within 24 hours of index NSTEMI date.\n\
    4. Index event on or after 2020-01-01 (EHR data completeness threshold).\n"
  exclusion_criteria: "1. Concurrent STEMI diagnosis (ICD-10 I21.0-I21.3, OMOP 312327)\
    \ within \xB11 day\n   of index event \u2014 managed on a separate quality pathway.\n\
    2. Type 2 MI (demand ischemia, ICD-10 I21.A1) documented by provider narrative\n\
    \   or clinical clarification flag.\n3. Insufficient data for troponin assessment\
    \ (v0.2.0+ only).\n"
  validation_status: draft
  validation_method: cohort_diagnostics
