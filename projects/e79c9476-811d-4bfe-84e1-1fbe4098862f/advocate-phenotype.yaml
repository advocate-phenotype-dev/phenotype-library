phenotype:
  name: Heart Failure with Reduced Ejection Fraction (HFrEF)
  version: 0.1.0
  domain: condition
  omop_aligned: true
  clarity_required: false
  target_concept_ids:
  - 316139
  - 4229440
  - 40479492
  icd_codes:
  - I50.1
  - I50.20
  - I50.21
  - I50.22
  - I50.23
  description: Identifies adult patients with heart failure with reduced ejection
    fraction (HFrEF), defined as a left ventricular ejection fraction (LVEF) less
    than 40% documented on echocardiography, with a confirmed ICD-10 diagnosis of
    heart failure. Derived from the OMOP Common Data Model using standard concept
    identifiers. Intended for use in trial-ready cohort identification and cardiovascular
    outcomes research.
  inclusion_criteria: Age >= 18 at index date; ICD-10-CM code I50.x (heart failure)
    in condition_occurrence; LVEF < 40% documented in measurement domain (LOINC 18009-2
    or 8806-2); Echocardiogram within 24 months prior to index date; At least one
    encounter in the 12 months prior to index date.
  exclusion_criteria: Age < 18; No qualifying echocardiogram within 24 months; LVEF
    >= 40% on most recent echocardiogram; Heart failure diagnosis in setting of acute
    MI only (I21.x as primary diagnosis with no subsequent heart failure encounter);
    Enrollment in hospice or palliative care at index date.
  validation_status: internal_validated
  validation_method: cohort_diagnostics
