  icd_codes:
  - I21.4
  description: Identifies Non-ST-elevation myocardial infarction (NSTEMI) admissions
    across the Advocate Health and Atrium Health network for quality measure reporting
    aligned to ACC/AHA chest-pain guidelines (2021) and CMS-based quality reporting.
  inclusion_criteria: "1. Condition occurrence: OMOP concept 314666 (NSTEMI), ICD-10\
    \ I21.4; includeDescendants = true, includeMapped = true.\n2. Encounter setting:\
    \ inpatient or emergency department visit (condition_type_concept_id IN 32817,\
    \ 32020).\n3. High-sensitivity cardiac troponin I (LOINC 10839-9, OMOP 3016502)\
    \ > 2\xD7 ULN (threshold 68 ng/L, ULN = 34 ng/L) within 24h of index date."
  exclusion_criteria: "1. Concurrent STEMI (ICD-10 I21.0\u2013I21.3, OMOP 312327)\
    \ within \xB11 day of index event.\n2. Type 2 MI (demand ischemia, ICD-10 I21.A1)\
    \ by provider documentation."
